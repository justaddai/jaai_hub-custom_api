x-ports:
  custom_api-port: &custom_api-port ${CUSTOM_API_PORT:-8000}
  mcp_server-port: &mcp-port ${MCP_PORT:-8001}

x-custom-api-env: &custom-api-env
  CUSTOM_API_PORT: *custom_api-port
  CUSTOM_API_USER: $CUSTOM_API_USER
  CUSTOM_API_PASSWORD: $CUSTOM_API_PASSWORD
  OPENAI_API_KEY: $OPENAI_API_KEY

x-mcp-server-env: &mcp-server-env
  MCP_PORT: *mcp-port
  MCP_API_KEY: $MCP_API_KEY

services:
  ### Custom API ###
  custom_api-ngrok:
    image: ngrok/ngrok:latest
    restart: always
    profiles:
      - custom_api
    command:
      - "http"
      - "custom_api:${CUSTOM_API_PORT}"
      - "--log=stdout"
      - "--authtoken=${NGROK_AUTHTOKEN}"
      - "--domain=${NGROK_CUSTOM_API_DOMAIN:-}"
      - "--subdomain=${NGROK_CUSTOM_API_SUBDOMAIN:-}"
    environment:
      NGROK_AUTHTOKEN: $NGROK_AUTHTOKEN
      NGROK_CUSTOM_API_DOMAIN: $NGROK_CUSTOM_API_DOMAIN
      NGROK_CUSTOM_API_SUBDOMAIN: $NGROK_CUSTOM_API_SUBDOMAIN
    depends_on:
      - custom_api

  custom_api:
    restart: always
    profiles:
      - custom_api
    build:
      context: ./custom_api
      dockerfile: Dockerfile
    ports:
      - target: *custom_api-port
        published: *custom_api-port
    environment: *custom-api-env

  ### MCP Server ###
  mcp-ngrok:
    image: ngrok/ngrok:latest
    restart: always
    profiles:
      - mcp_server
    command:
      - "http"
      - "mcp_server:${MCP_PORT:-8001}"
      - "--log=stdout"
      - "--authtoken=${NGROK_AUTHTOKEN}"
      - "--domain=${NGROK_MCP_DOMAIN:-}"
      - "--subdomain=${NGROK_MCP_SUBDOMAIN:-}"
    environment:
      NGROK_AUTHTOKEN: $NGROK_AUTHTOKEN
      NGROK_MCP_DOMAIN: $NGROK_MCP_DOMAIN
      NGROK_MCP_SUBDOMAIN: $NGROK_MCP_SUBDOMAIN
    depends_on:
      - mcp_server

  mcp_server:
    restart: always
    profiles:
      - mcp_server
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    ports:
      - target: *mcp-port
        published: *mcp-port
    environment: *mcp-server-env
    volumes:
      - ./mcp_server/src/:/mcp_server/src/
